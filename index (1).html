<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>英文期中考｜聽寫練習器</title>
<style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#172033;background:#f5f7fc}*{box-sizing:border-box}body{margin:0;padding:22px}main{max-width:750px;margin:0 auto}h1{font-size:26px;margin-bottom:7px}p{color:#586174;line-height:1.6}.panel{background:white;border:1px solid #dbe0ea;border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 2px 14px #1122440b}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit}button{background:#244ed2;color:white;border:0;border-radius:9px;padding:11px 17px;cursor:pointer}button.secondary{background:#edf1fa;color:#21345d}button:disabled{opacity:.4;cursor:default}input{display:block;width:100%;border:1px solid #aab5c8;border-radius:9px;padding:12px;margin:8px 0 15px}label{font-weight:600;font-size:14px}select{padding:9px;border:1px solid #aab5c8;border-radius:8px}#result{line-height:1.8;white-space:pre-line}#question{font-size:19px;font-weight:700}#score{font-weight:700}.muted{color:#667084;font-size:14px}.hidden{display:none}.correct{color:#167348}.wrong{color:#b33b30}.stack{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:550px){.stack{grid-template-columns:1fr}h1{font-size:23px}body{padding:12px}.panel{padding:16px}}
</style>
</head>
<body><main>
<h1>🎧 英文期中考｜聽寫練習器</h1>
<p>老師的 20 題單字。只顯示題號，不顯示英文與中文。聽完再填答案，每題可以無限重播，完成後才揭曉答案。</p>
<section class="panel">
<div class="controls"><label for="mode">出題模式</label><select id="mode"><option value="all">全部 20 題（隨機）</option><option value="mistakes">只練本次錯題</option></select><label for="rate">語速</label><select id="rate"><option value="0.75">0.75×</option><option value="0.85" selected>0.85×</option><option value="1">正常</option></select></div>
<p class="muted">語音使用裝置內建英文發音引擎，無需下載音檔。首次播放請按按鈕。</p>
<div class="controls"><button id="start">開始新一回</button><button id="reset" class="secondary">清除錯題紀錄</button></div>
</section>
<section class="panel" id="exercise" hidden>
<div class="controls" style="justify-content:space-between"><span id="question">第 1 題</span><span id="score">已完成 0 題</span></div>
<p class="muted">按「播放英文」，依照發音寫下英文及中文。不要看答案，寫好再核對。</p>
<div class="controls"><button id="speak">🔊 播放英文</button><button class="secondary" id="repeat">再聽一次</button></div>
<br><label for="english">英文（完整拼字／片語）</label><input id="english" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="聽到的英文…">
<label for="chinese">中文（寫一個意思即可）</label><input id="chinese" autocomplete="off" placeholder="中文意思…">
<div class="controls"><button id="check">核對答案</button><button id="next" class="secondary" disabled>下一題</button></div>
<p id="result" role="status" aria-live="polite"></p>
</section>
<section class="panel" id="summary" hidden><h2>本回成績</h2><p id="summaryText"></p><button id="retry">再練錯題</button></section>
<footer class="muted">提示：不同手機、瀏覽器的英文語音可能略有差異；如果無法播放，先確認裝置音量並使用最新版 Chrome、Edge 或 Safari。</footer>
</main>
<script>
const WORDS=[
['position',['職位','職務','位置']],['domestic consumption',['國內消費']],['marketing strategy',['行銷策略','營銷策略']],['promotion',['升遷','升職','促銷','推廣']],['fuel-efficient',['省燃料的','省油的','節能的','燃料效率高的']],
['appliance',['家電','家用電器','電器']],['be available',['可獲得的','可取得的','可用的','有空的']],['schedule',['安排','排程','時間表','行程表','行程','日程表']],['confirmation code',['確認碼','確認代碼']],['be invalid',['失效的','無效的','失效','無效']],
['make a reservation',['訂位','預約','訂位子','預訂']],['bank statement',['銀行明細','銀行對帳單','銀行交易明細','銀行帳戶明細']],['automatic debit option',['自動扣款選項','自動扣款的選項']],['reimbursement',['補償','報銷','費用補還','費用報銷','償還']],['under warranty',['保固期間','保固期間內','在保固期間內','保固中','在保固期內']],
['estimation',['估計','估價','估算']],['be dedicated to',['致力於','奉獻於']],['participate in',['參加','參與']],['customize',['客製化','定製','訂製']],['customer satisfaction',['客人滿意度','顧客滿意度','客戶滿意度']]
];
let order=[], index=0, finished=0, mistakes=new Set(), score=0, checked=false;
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[‐‑–—]/g,'-').replace(/\s+/g,' ').trim();
const normZh=s=>s.replace(/[\s　，,。！!（）()]/g,'').trim();
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function speak(){if(!('speechSynthesis' in window)){alert('目前瀏覽器不支援語音播放，請改用 Chrome、Edge 或 Safari。');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(WORDS[order[index]][0]);u.lang='en-US';u.rate=Number($('rate').value);let voices=speechSynthesis.getVoices();let v=voices.find(x=>x.lang.toLowerCase().startsWith('en-us'))||voices.find(x=>x.lang.toLowerCase().startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u);}
function render(){if(index>=order.length){$('exercise').hidden=true;$('summary').hidden=false;$('summaryText').textContent=`完成 ${order.length} 題；英文與中文皆正確：${score} 題；需複習：${order.length-score} 題。`;return;}$('exercise').hidden=false;$('summary').hidden=true;$('question').textContent=`第 ${index+1} / ${order.length} 題`;$('score').textContent=`已完成 ${finished} 題`;$('english').value='';$('chinese').value='';$('result').textContent='';$('check').disabled=false;$('next').disabled=true;checked=false;}
function start(forceMistakes=false){let base=forceMistakes||$('mode').value==='mistakes'?[...mistakes]:WORDS.map((_,i)=>i);if(!base.length){alert('目前沒有錯題，請選擇全部 20 題。');return;}order=shuffle([...base]);index=0;finished=0;score=0;render();}
$('start').onclick=()=>start();$('retry').onclick=()=>start(true);$('reset').onclick=()=>{mistakes.clear();alert('本次錯題紀錄已清除。');};$('speak').onclick=speak;$('repeat').onclick=speak;
$('check').onclick=()=>{if(checked)return;let id=order[index],w=WORDS[id],en=norm($('english').value),zh=normZh($('chinese').value);if(!en&&!zh){alert('請先填寫英文與中文再核對。');return;}let enOK=en===norm(w[0]),zhOK=w[1].some(z=>normZh(z)===zh);if(enOK&&zhOK){score++;mistakes.delete(id);}else mistakes.add(id);$('result').textContent=`英文：${enOK?'✓':'✗'}  正解：${w[0]}\n中文：${zhOK?'✓':'✗'}  參考：${w[1].join('／')}\n${enOK&&zhOK?'本題過關！':'本題已記入錯題，可在下一回重練。'}`;$('result').className=enOK&&zhOK?'correct':'wrong';checked=true;finished++;$('score').textContent=`已完成 ${finished} 題`;$('check').disabled=true;$('next').disabled=false;};
$('next').onclick=()=>{if(!checked)return;index++;render();};
</script>
</body></html>
